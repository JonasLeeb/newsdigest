# Tuning knobs. Run `python -m newsdigest inspect` after a few fetches to check
# clusters, then adjust distance_threshold.

window_hours: 36            # articles older than this are ignored for the digest
keep_hours: 72              # articles older than this are dropped from the store

clustering:
  backend: embedding        # embedding (multilingual, groups DE+EN coverage) | tfidf (no model, same-language only)
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  distance_threshold: 0.42  # cosine distance, average linkage. Lower = stricter (smaller stories)
  tfidf_distance_threshold: 0.75

digest:
  top_stories: 10
  germany_stories: 8
  blindspots_per_side: 3
  science_stories: 8
  science_topics: [Space, Science, Tech]
  min_sources_top: 3        # distinct outlets for a story to count as "top"
  blindspot_min_sources: 3
  blindspot_share: 0.8      # share of partisan (non-center) coverage from one side

germany:
  # A story is "Deutschland" if at least this share of its articles come from a
  # scope:de feed or mention one of the keywords.
  min_share: 0.5
  keywords: [Deutschland, Germany, German, deutsche, Bundestag, Bundesrat, Bundesregierung,
             Bundeskanzler, Kanzler, Merz, Bundesverfassungsgericht, Bundeswehr, Bundesland,
             Landtag, CDU, CSU, SPD, AfD, Grüne, Grünen, FDP, BSW, Linke, Berlin, Bayern,
             Sachsen, Thüringen, Brandenburg, Hessen, Niedersachsen, Nordrhein-Westfalen,
             NRW, Baden-Württemberg, Hamburg, München, Köln, Frankfurt, Deutsche Bahn, Deutschen Bahn, Bundesbank]

# Topic tagging: each story goes to the topic whose phrases are closest to it
# (multilingual embeddings, so German and English phrases both work).
topic_min_similarity: 0.18
topics:
  Politics:   [Politik Regierung Parlament Koalition Partei Wahl, politics government parliament coalition party election, Gesetz Minister Kanzler Bundestag, president prime minister vote]
  Economy:    [Wirtschaft Unternehmen Börse Inflation Konjunktur, economy business markets inflation companies, Arbeitsmarkt Jobs Löhne Industrie, trade tariffs banks interest rates]
  Conflict:   [Krieg Militär Angriff Armee Waffen, war military attack troops weapons, Ukraine Russland Nahost Gaza Israel, ceasefire missile strike defence NATO]
  Migration:  [Migration Asyl Flüchtlinge Abschiebung Grenze, migration asylum refugees deportation border]
  Climate:    [Klima Umwelt Energie Wetter Hitze Unwetter, climate environment energy emissions weather storm, Klimaschutz Erneuerbare CO2, renewable energy pollution]
  Justice:    [Gericht Urteil Polizei Ermittlungen Prozess Kriminalität, court ruling police investigation trial crime]
  Space:      [Raumfahrt Rakete Raketenstart Weltraum Satellit Astronaut, space rocket launch orbit satellite astronaut, SpaceX Starship Falcon NASA ESA Artemis ISS, Mond Mars Planet Teleskop Asteroid, moon mars planet telescope asteroid galaxy]
  Science:    [Wissenschaft Forschung Studie Forscher Physik Biologie Chemie, science research study scientists physics biology chemistry, Archäologie Evolution Genetik Quanten, archaeology evolution genetics quantum fossils]
  Tech:       [Technologie künstliche Intelligenz Software Internet Digitalisierung Chips, technology artificial intelligence software internet chips, Smartphone Apple Google Microsoft OpenAI Nvidia, cybersecurity hackers data privacy apps gadgets]
  Health:     [Gesundheit Krankenhaus Medizin Krankheit Pflege, health hospital medicine disease healthcare]
  Society:    [Gesellschaft Bildung Schule Familie Wohnen Mieten Verkehr Bahn, society education schools housing transport]
  Sport:      [Fußball Bundesliga Sport Spiel Tor Trainer, football soccer sport match game coach championship]
  Culture:    [Kultur Kino Film Musik Kunst Buch Promi, culture film music art books celebrity]
