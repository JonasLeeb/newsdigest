name: digest

on:
  schedule:
    # UTC. Every 3 h from 02:17 to 20:17 -> the 05:17 run is your ~06:17 morning digest (Berlin, winter time).
    - cron: "17 2-20/3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]   # rebuild right away when you change code or sources (bot commits do not retrigger)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only torch keeps this fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.yaml') }}

      - name: Fetch + build
        run: python -m newsdigest run

      - name: Commit article store and archive
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/articles.json.gz data/feed_status.json site/archive
          git diff --cached --quiet || git commit -m "digest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
